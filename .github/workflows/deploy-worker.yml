name: Deploy Cloudflare (Worker + Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apps/telegram-worker/**'
      - 'apps/mini-app/**'
      - 'scripts/**'
      - '.github/workflows/deploy-worker.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check source and committed secrets
        run: |
          npm run check
          npm run security:check
          npm test
      - name: Validate the three root secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Thiếu GitHub Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Thiếu GitHub Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [[ "$BOT_TOKEN" =~ ^[0-9]{6,12}:[A-Za-z0-9_-]{30,}$ ]] || { echo "GitHub Secret BOT_TOKEN thiếu hoặc không đúng định dạng."; exit 1; }
      - name: Bootstrap Cloudflare resources (Worker, Pages, D1, KV)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/bootstrap-cloudflare.mjs
      - name: Render deployment bindings
        run: node scripts/render-cloudflare-config.mjs
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply hendydichvumang --remote --config apps/telegram-worker/wrangler.generated.toml
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/telegram-worker/wrangler.generated.toml
      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..10}; do
            if curl --fail --silent "$WORKER_API_URL/health" -o /tmp/hendy-health.json; then
              cat /tmp/hendy-health.json
              exit 0
            fi
            sleep 3
          done
          echo "Worker health check failed after deployment."
          exit 1
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PAYMENT_BANK_CODE: ${{ secrets.PAYMENT_BANK_CODE }}
          PAYMENT_BANK_NAME: ${{ secrets.PAYMENT_BANK_NAME }}
          PAYMENT_ACCOUNT_NUMBER: ${{ secrets.PAYMENT_ACCOUNT_NUMBER }}
          PAYMENT_ACCOUNT_NAME: ${{ secrets.PAYMENT_ACCOUNT_NAME }}
          PAYMENT_QR_URL: ${{ secrets.PAYMENT_QR_URL }}
          PAYMENT_TRANSFER_NOTE_PREFIX: ${{ secrets.PAYMENT_TRANSFER_NOTE_PREFIX }}
          SUPPORT_URL: ${{ secrets.SUPPORT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(node scripts/generate-webhook-secret.mjs)"
          echo "::add-mask::$WEBHOOK_SECRET"
          printf '%s' "$BOT_TOKEN" | npx wrangler secret put BOT_TOKEN --config apps/telegram-worker/wrangler.generated.toml
          printf '%s' "$WEBHOOK_SECRET" | npx wrangler secret put WEBHOOK_SECRET --config apps/telegram-worker/wrangler.generated.toml
          unset WEBHOOK_SECRET

          for name in PAYMENT_BANK_CODE PAYMENT_BANK_NAME PAYMENT_ACCOUNT_NUMBER PAYMENT_ACCOUNT_NAME PAYMENT_QR_URL PAYMENT_TRANSFER_NOTE_PREFIX SUPPORT_URL; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config apps/telegram-worker/wrangler.generated.toml
            else
              npx wrangler secret delete "$name" --config apps/telegram-worker/wrangler.generated.toml || true
            fi
          done
      - name: Register Telegram webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          WEBHOOK_SECRET="$(node scripts/generate-webhook-secret.mjs)"
          echo "::add-mask::$WEBHOOK_SECRET"
          export WEBHOOK_SECRET
          node apps/telegram-worker/scripts/set-webhook.mjs
          unset WEBHOOK_SECRET
      - name: Configure Mini App API URL
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("apps/mini-app/index.html")
          html = path.read_text()
          api_url = os.environ["WORKER_API_URL"].rstrip("/")
          placeholder = "__WORKER_API_URL__"
          if placeholder not in html:
              raise SystemExit("Missing Worker API URL placeholder in Mini App index.html")
          path.write_text(html.replace(placeholder, api_url))
          PY
      - name: Deploy Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy apps/mini-app --project-name hendydichvumang --branch main
      - name: Deployment summary
        run: |
          {
            echo "### Hendy Cloudflare Deployment"
            echo "- Worker API: $WORKER_API_URL"
            echo "- Telegram webhook: $WORKER_API_URL/telegram/webhook"
            echo "- Mini App: $MINI_APP_URL"
            echo "- D1: hendydichvumang"
            echo "- KV: hendydichvumang-cache"
            echo "- Bot Token: stored only as a Cloudflare Worker Secret (value not displayed)"
          } >> "$GITHUB_STEP_SUMMARY"
