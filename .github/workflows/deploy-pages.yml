name: Deploy Mini App to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/mini-app/**'
      - 'scripts/bootstrap-cloudflare.mjs'
      - 'scripts/render-cloudflare-config.mjs'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Cloudflare secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Thiếu GitHub Secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Thiếu GitHub Secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Create Cloudflare resources and derive URLs
        run: node scripts/bootstrap-cloudflare.mjs
      - name: Configure Worker API URL
        shell: bash
        run: |
          set -euo pipefail
          export WORKER_API_URL
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path("apps/mini-app/index.html")
          html = path.read_text()
          api_url = os.environ["WORKER_API_URL"].rstrip("/")
          placeholder = '__WORKER_API_URL__'
          if placeholder not in html:
              raise SystemExit("Không tìm thấy placeholder WORKER_API_URL trong index.html")
          path.write_text(html.replace(placeholder, api_url))
          PY
      - name: Deploy Pages
        run: npx wrangler pages deploy apps/mini-app --project-name hendydichvumang --branch main
      - name: Deployment summary
        run: |
          {
            echo "### Hendy Mini App"
            echo "- Mini App: $MINI_APP_URL"
            echo "- Worker API: $WORKER_API_URL"
          } >> "$GITHUB_STEP_SUMMARY"
