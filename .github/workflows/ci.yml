name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hendy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hendy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hendy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify source and PostgreSQL migrations
        run: npm run verify
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install aiogram bot dependencies
        run: python -m pip install --disable-pip-version-check -r apps/bot_phu/requirements.txt
      - name: Verify aiogram source and unit tests
        run: |
          python -m compileall -q apps/bot_phu
          python -m unittest discover -s apps/bot_phu/tests -p "test_*.py" -v

      - name: Build separate Static Site
        run: npm run build:static
        env:
          STATIC_API_BASE_URL: https://api.example.com
