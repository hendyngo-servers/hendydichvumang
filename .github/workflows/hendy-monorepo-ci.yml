name: HENDY monorepo CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  static-website:
    name: Static Website validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate published assets
        run: |
          test -s website/public/index.html
          test -s website/public/healthz.html
          test -s website/public/robots.txt
          test -s website/public/sitemap.xml
          ! find website/public -type f -name '*.php' | grep .
          ! find website/public -type f \( -name '*.env' -o -name '*.sql' -o -name '*.pem' -o -name '*.key' \) | grep .
          grep -q 'HENDY DIGITAL' website/public/index.html
          grep -q 'hendydichvumang-telegram-bot.onrender.com/admin' website/public/index.html
  telegram-bot:
    name: Telegram Bot lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram-bot
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, pdo, pdo_pgsql
          coverage: none
      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer lint
      - run: composer test
      - run: php scripts/secret-scan.php
  neon-runtime:
    name: Neon Function build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm test
