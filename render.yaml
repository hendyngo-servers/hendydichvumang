# Two independent Render services and two independent Neon databases.
services:
  - type: web
    name: hendydichvumang-website
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: NEON_STORAGE_FUNCTION_URL
        value: "https://br-wild-cell-az3siwry-hendystorage.compute.c-3.ap-southeast-1.aws.neon.tech"
      - key: NEON_STORAGE_FUNCTION_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TELEGRAM_BOT_URL
        sync: false
  - type: web
    name: hendydichvumang-telegram-bot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: telegram-bot
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: DB_STARTUP_WAIT_SECONDS
        value: "120"
      - key: WEBHOOK_AUTO_REGISTER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: NEON_STORAGE_FUNCTION_URL
        value: "https://br-wild-cell-az3siwry-hendystorage.compute.c-3.ap-southeast-1.aws.neon.tech"
      - key: NEON_STORAGE_FUNCTION_KEY
        sync: false
      - key: BOT1_TOKEN
        sync: false
      - key: BOT2_TOKEN
        value: ""
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: HOMEPROXY_ENCRYPTION_KEY
        sync: false
      - key: BANK_WEBHOOK_ENABLED
        value: "false"
      - key: WEBSOCKET_ENABLED
        value: "false"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
      - key: VIETQR_BANK_ID
        sync: false
      - key: VIETQR_ACCOUNT_NO
        sync: false
      - key: VIETQR_ACCOUNT_NAME
        sync: false
      - key: GROUP_URL
        sync: false
      - key: CHANNEL_URL
        sync: false
      - key: SUPPORT_URL
        sync: false
