services:
  - type: web
    name: hendydichvumang
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --no-audit --no-fund && npm run verify
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hendydichvumang-db
          property: connectionString
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: hendydichvumang-db
    databaseName: hendydichvumang
    user: hendydichvumang
    plan: free
    region: singapore
    postgresMajorVersion: "18"
