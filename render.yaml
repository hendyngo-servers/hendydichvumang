# HENDY: one primary Telegram Bot, one static public Website and a temporary static fallback.
# Secrets (DATABASE_URL, BOT1_TOKEN, ADMIN_ID(S), HOMEPROXY_ENCRYPTION_KEY, bank credentials) stay in Render Environment and are never committed here.
services:
  - type: web
    name: hendydichvumang-website
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.html
    autoDeployTrigger: checksPass

  - type: web
    name: hendydichvumang-static-site
    runtime: static
    branch: main
    buildCommand: echo "HENDY Static Site - no build step"
    staticPublishPath: ./website/public
    autoDeployTrigger: checksPass
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate

  - type: web
    name: hendydichvumang-telegram-bot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./telegram-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: WEBSITE_PUBLIC_URL
        value: https://hendydichvumang-static-site.onrender.com
      - key: PORT
        value: "10000"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: DB_STARTUP_WAIT_SECONDS
        value: "120"
      - key: WEBHOOK_AUTO_REGISTER
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: NEON_STORAGE_FUNCTION_URL
        value: "https://br-wild-cell-az3siwry-hendystorage.compute.c-3.ap-southeast-1.aws.neon.tech"
      - key: BANK_WEBHOOK_ENABLED
        value: "false"
      - key: WEBSOCKET_ENABLED
        value: "false"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
