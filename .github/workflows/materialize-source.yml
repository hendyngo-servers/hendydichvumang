name: Materialize Render source tree

on:
  push:
    branches: [main]
    paths:
      - 'app-source.part-*.b64'
      - '.github/workflows/materialize-source.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-source-main
  cancel-in-progress: false

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate and extract source archive
        shell: bash
        run: |
          set -euo pipefail
          cat app-source.part-*.b64 > /tmp/hendy-source.tar.gz
          echo '--- archive bytes ---'
          wc -c /tmp/hendy-source.tar.gz
          echo '--- gzip validation ---'
          gzip -t /tmp/hendy-source.tar.gz
          echo 'GZIP_OK'
          tar -tzf /tmp/hendy-source.tar.gz > /tmp/hendy-source-files.txt
          echo '--- archive entries ---'
          sed -n '1,30p' /tmp/hendy-source-files.txt
          grep -Eq '(^|/)src/server.js$' /tmp/hendy-source-files.txt
          grep -Eq '(^|/)public/admin.js$' /tmp/hendy-source-files.txt
          mkdir -p /tmp/hendy-extract
          tar -xzf /tmp/hendy-source.tar.gz -C /tmp/hendy-extract
          server_file="$(find /tmp/hendy-extract -type f -path '*/src/server.js' -print -quit)"
          test -n "$server_file"
          source_root="$(dirname "$(dirname "$server_file")")"
          cp -a "$source_root"/. .
          test -f src/server.js
          test -f public/admin.js
          test -f migrations/001_init.sql

      - name: Install and verify application
        run: |
          npm install --no-audit --no-fund
          npm run verify

      - name: Commit materialized source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Source tree is already materialized."
            exit 0
          fi
          git commit -m "Materialize complete Render application source tree"
          git push origin HEAD:main
