services:
  # Static UI được phân phối qua CDN; API và webhook chạy ở Web Service bên dưới.
  - type: web
    name: hendydichvumang-site
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build:static
    staticPublishPath: dist-site
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /admin
        destination: /admin.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: STATIC_API_BASE_URL
        fromService:
          type: web
          name: hendydichvumang-api
          envVarKey: RENDER_EXTERNAL_URL

  # API, PostgreSQL migrations and Telegram webhook.
  - type: web
    name: hendydichvumang-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --no-audit --no-fund && npm run verify
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PG_POOL_MAX
        value: "5"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
