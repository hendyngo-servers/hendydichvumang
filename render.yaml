# HENDY monorepo Blueprint: adopt the existing two Render web services.
# Service names intentionally match the current Render resources. Do not rename.
# Neon PostgreSQL remains externally managed and is not replaced by Render Postgres.
# Secrets and account-specific settings (DATABASE_URL, NEON_STORAGE_FUNCTION_KEY,
# BOT1_TOKEN, ADMIN_ID(S), HOMEPROXY_ENCRYPTION_KEY, bank/account details) stay in
# the existing Render Environment. They are intentionally omitted here: Render
# preserves existing env vars omitted from a Blueprint, avoiding secret re-entry.
# Runtime is intentionally single-bot; only the primary token is read.
services:
  - type: web
    name: hendydichvumang-website
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz.php
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_SSL
        value: "true"
      - key: NEON_STORAGE_FUNCTION_URL
        value: "https://br-wild-cell-az3siwry-hendystorage.compute.c-3.ap-southeast-1.aws.neon.tech"

  - type: web
    name: hendydichvumang-telegram-bot
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./telegram-bot/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: production
      - key: WEBSITE_PUBLIC_URL
        value: "https://hendydichvumang-website.onrender.com"
      - key: PORT
        value: "10000"
      - key: RUN_MIGRATIONS_ON_START
        value: "false"
      - key: DB_STARTUP_WAIT_SECONDS
        value: "120"
      - key: WEBHOOK_AUTO_REGISTER
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: NEON_STORAGE_FUNCTION_URL
        value: "https://br-wild-cell-az3siwry-hendystorage.compute.c-3.ap-southeast-1.aws.neon.tech"
      - key: BANK_WEBHOOK_ENABLED
        value: "false"
      - key: WEBSOCKET_ENABLED
        value: "false"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
