name = "hendydichvumang-bot"
main = "src/index.js"
compatibility_date = "2026-11-04"
workers_dev = true

[vars]
MINI_APP_URL = "https://hendydichvumang.pages.dev/"
MINI_APP_ORIGIN = "https://hendydichvumang.pages.dev"
SUPPORT_URL = "https://t.me/"

[observability]
enabled = true
head_sampling_rate = 1

# Cloudflare Rate Limiting binding: approximate per-location limit.
# Keep this as a first layer; high-value transactions also need D1/DO idempotency.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "8732461"

[ratelimits.simple]
limit = 60
period = 60
