name = "hendydichvumang-bot"
main = "src/index.js"
compatibility_date = "2026-11-04"
workers_dev = true

[vars]
MINI_APP_URL = "__MINI_APP_URL__/"
MINI_APP_ORIGIN = "__MINI_APP_URL__"

[[d1_databases]]
binding = "DB"
database_name = "hendydichvumang"
database_id = "__D1_DATABASE_ID__"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "CACHE"
id = "__KV_NAMESPACE_ID__"

# API-level abuse protection; high-value operations must also be guarded by D1 idempotency.
[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "8732461"

[ratelimits.simple]
limit = 60
period = 60

[triggers]
crons = ["*/5 * * * *", "0 17 * * *"]

[observability]
enabled = true
head_sampling_rate = 1
